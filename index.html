<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Portal de Metas EPH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna; barra de abas por setor + Gerenciamento; sub-abas dentro de cada área */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --ink:#2E241C; --title:#5C4636; --muted:#6F604F;
  --primary:#8A6E45; --primary-ink:#FFFFFF; --line:#E3D8C6; --soft:#EFE7DA;
  --ok:#2F7D4F; --ok-bg:#E3F1E8; --warn:#8A5D00; --warn-bg:#FBF0D6; --bad:#A23B2E; --bad-bg:#F8E2DE; --info:#3D5F86; --info-bg:#E2EBF5;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body:"Libre Franklin", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1712; --surface:#262019; --ink:#EDE4D7; --title:#E3CFB4; --muted:#AE9E8B;
  --primary:#C4A272; --primary-ink:#1C1712; --line:#3A3027; --soft:#2F2820;
  --ok:#7CC79A; --ok-bg:#1F3328; --warn:#E3B957; --warn-bg:#3A2F17; --bad:#EE8E80; --bad-bg:#3D2420; --info:#94B6DC; --info-bg:#1F2B3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1712; --surface:#262019; --ink:#EDE4D7; --title:#E3CFB4; --muted:#AE9E8B;
  --primary:#C4A272; --primary-ink:#1C1712; --line:#3A3027; --soft:#2F2820;
  --ok:#7CC79A; --ok-bg:#1F3328; --warn:#E3B957; --warn-bg:#3A2F17; --bad:#EE8E80; --bad-bg:#3D2420; --info:#94B6DC; --info-bg:#1F2B3A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;color:var(--title);font-size:2.2rem;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;color:var(--title);font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:1rem;font-weight:600;margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.comp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.comp input{width:auto}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
@media (max-width:720px){nav.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}}
.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.mgmt-btn{background:var(--surface);color:var(--title);border:1px solid var(--title);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.mgmt-btn[aria-pressed="true"]{background:var(--title);color:var(--bg)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 11px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--title);border-bottom-color:var(--primary);font-weight:600}
nav.sub{display:flex;gap:6px;flex-wrap:wrap}
nav.sub button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:500}
nav.sub button[aria-selected="true"]{background:var(--title);border-color:var(--title);color:var(--bg)}
.rule{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:13.5px}
.rule b{color:var(--title)}
.strip{display:flex;align-items:center;gap:8px;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi{border-top:2px solid var(--line);padding-top:8px}
.kpi .n{font-family:var(--f-mono);font-size:1.6rem;color:var(--title);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert{border-top-color:var(--bad)} .kpi.alert .n{color:var(--bad)}
.kpi.good{border-top-color:var(--ok)} .kpi.good .n{color:var(--ok)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right} td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.full i{background:var(--ok)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.meta{font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-agendado{background:var(--info-bg);color:var(--info)}
.p-aguardando,.p-risco{background:var(--warn-bg);color:var(--warn)}
.p-validado,.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-reprovado,.p-atrasado,.p-nao{background:var(--bad-bg);color:var(--bad)}
.p-incompleto,.p-neutro{background:var(--soft);color:var(--muted)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.slot.done{border-style:solid;border-color:var(--ok)}
.slot a{color:var(--primary);word-break:break-all}
.slot input[type=file]{padding:4px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.btn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.good{background:var(--ok);color:var(--surface)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.notice{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--title);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
details>summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:14px}
.chk{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chk .it{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.chk .it:last-child{border-bottom:0}
.chk .tx{flex:1 1 260px;min-width:0;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{display:flex;align-items:center;justify-content:center;min-width:46px;min-height:36px;padding:0 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:inherit}
.seg label.c:has(input:checked){background:var(--ok-bg);color:var(--ok)}
.seg label.nc:has(input:checked){background:var(--bad-bg);color:var(--bad)}
.seg label.na:has(input:checked){background:var(--soft);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:-2px}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px}
.pres label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
.q{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.q .opt{display:flex;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>Esmeralda Praia Hotel · MNL-RH-02</small>
      <h1>Portal de Metas</h1>
    </div>
    <div class="hdr-right"><label class="comp" for="competencia"><span>Competência</span><input type="month" id="competencia"></label><button type="button" class="mgmt-btn" id="btn-ger" aria-pressed="false" hidden>Gerenciamento</button><button type="button" class="btn ghost" id="btn-sair" hidden>Sair</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Abas por gestor" hidden></nav>
  <p class="notice" id="conn">Conectando ao banco de dados…</p>
  <main id="view" class="list" style="gap:16px"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SETORES=[["governanca","Governança","Keyte"],["recepcao","Recepção","Marcone"],["aeb","A&B","[confirmar]"],["manutencao","Manutenção","Lindemberg"],["compras","Compras","Anderson"],["controladoria","Controladoria","Kleyber"],["rh","RH","Aline [confirmar]"],["dp","DP","[nome]"],["reservas","Reservas","[nome]"],["marketing","Marketing","[nome]"],["portaria","Portaria/CFTV","Márcio"],["processos","Processos","[nome]"]];
const SNOME=Object.fromEntries(SETORES.map(s=>[s[0],s[1]]));
const EVID=[["presenca","Lista de presença"],["foto","Registro fotográfico"],["conteudo","Conteúdo aplicado"]];
const S={db:null,assets:null,uid:null,canEdit:false,canWrite:true,tr:[],val:{},blitz:[],resp:[],func:[],aval:[],mod:[],area:"governanca",sub:"treinos",gsub:"geral",open:{}};
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function hoje(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(s){if(!s)return"";const[y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y}
function comp(){return $("competencia").value}
function compTxt(){const[y,m]=comp().split("-");return m+"/"+y}
const nowISO=()=>new Date().toISOString();
function errMsg(e,fallback){return e&&e.code==="invalid_argument"?"Seu acesso não permite esta ação.":fallback}
function kpi(n,l,cls){return h("div",{class:"kpi"+(cls?" "+cls:"")},h("div",{class:"n",text:n}),h("div",{class:"l",text:l}))}
function bar(p,txt){return h("div",{style:"display:flex;align-items:center;gap:8px"},h("div",{class:"bar"+(p===100?" full":"")},h("i",{style:"width:"+p+"%"})),h("span",{class:"mono",text:txt}))}

/* ---------- regras de treinamento ---------- */
function evidOk(t){return EVID.every(([k])=>t.evidencias&&t.evidencias[k]&&t.evidencias[k].id)}
function status(t){
  const v=S.val[t.id];
  if(v&&(!t.realizadoEm||v.em>=t.realizadoEm))return v.resultado==="validado"?"validado":"reprovado";
  if(t.realizadoEm&&evidOk(t))return"aguardando";
  if(t.data<hoje())return"atrasado";
  if(t.evidencias&&Object.keys(t.evidencias).length)return"incompleto";
  return"agendado";
}
const LBL={agendado:"Agendado",incompleto:"Evidência incompleta",aguardando:"Aguardando RH",validado:"Validado",reprovado:"Reprovado",atrasado:"Sem comprovação"};
const pill=(st,txt)=>h("span",{class:"pill p-"+st},txt||LBL[st]);
const noMes=t=>(t.data||"").slice(0,7)===comp();
const prazoAgenda=()=>comp()+"-01T23:59:59";
function foraPrazo(t){return t.criadoEm&&t.criadoEm.slice(0,19)>prazoAgenda()&&t.criadoEm.slice(0,7)>=comp()}
function treinosSetor(s){return S.tr.filter(t=>t.setor===s&&noMes(t)).sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||"")))}
function resumoSetor(s){
  const ts=treinosSetor(s);const r={ag:ts.length,co:0,va:0,at:0,rep:0,noPrazo:ts.some(t=>!foraPrazo(t))};
  ts.forEach(t=>{const st=status(t);if(st==="aguardando"||st==="validado")r.co++;if(st==="validado")r.va++;if(st==="atrasado")r.at++;if(st==="reprovado")r.rep++});
  r.pct=r.ag?Math.round(r.va/r.ag*100):0;
  r.sit=!r.ag?"nao":(r.at||r.rep)?"nao":(r.va===r.ag?"ok":"risco");
  const av=ultimasAval(s);r.conf=av.length?Math.round(av.reduce((a,x)=>a+x.conformidade,0)/av.length):null;
  const bm=Object.fromEntries(S.blitz.map(b=>[b.id,b]));const ns=S.resp.filter(x=>bm[x.blitzId]&&bm[x.blitzId].setor===s&&(x.em||"").slice(0,7)===comp()).map(x=>x.nota);
  r.blitz=ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length):null;
  return r;
}
const SIT={ok:"Atingida",risco:"Em risco",nao:"Não atingida"};

/* ---------- equipe e checklist ---------- */
function funcSetor(s,todos){return S.func.filter(f=>f.setor===s&&(todos||f.ativo!==false)).sort((a,b)=>a.nome.localeCompare(b.nome))}
function modelosSetor(s){return S.mod.filter(m=>m.setor===s).sort((a,b)=>a.funcao.localeCompare(b.funcao))}
function modeloGeral(){return S.mod.find(m=>m.id==="geral")}
function itensDe(funcao){const g=modeloGeral();const m=S.mod.find(x=>x.id===funcao);return[...(g?g.itens.map(t=>({t,g:true})):[]),...(m?m.itens.map(t=>({t,g:false})):[])]}
function avalDe(fid){return S.aval.filter(a=>a.funcionarioId===fid).sort((a,b)=>(b.data||"").localeCompare(a.data||""))}
function ultimasAval(s){return funcSetor(s).map(f=>avalDe(f.id).find(a=>(a.data||"").slice(0,7)===comp())).filter(Boolean)}
function nomeFuncao(id){const m=S.mod.find(x=>x.id===id);return m?m.funcao:(id||"Sem função")}

/* ---------- abas ---------- */
function renderTabs(){
  const nav=$("tabs");
  nav.replaceChildren(...SETORES.filter(([id])=>!S.setoresVisiveis||S.setoresVisiveis.includes(id)).map(([id,nome])=>h("button",{role:"tab","aria-selected":S.area===id?"true":"false",onclick:()=>go(id)},nome)));
  $("btn-ger").setAttribute("aria-pressed",S.area==="gerenciamento"?"true":"false");
}
function go(area,sub){if(S.setoresVisiveis&&area!==S.setoresVisiveis[0])return;S.area=area;if(sub)S.sub=sub;try{localStorage.setItem("pm-area",area)}catch(e){}render()}
function subnav(items,cur,set){return h("nav",{class:"sub","aria-label":"Seções"},items.map(([k,l])=>h("button",{"aria-selected":cur===k?"true":"false",onclick:()=>{set(k);render()}},l)))}

function render(){
  if(!S.db)return;
  if(S.pending&&S.connTxt)$("conn").textContent=S.connTxt;
  S.dirty=false;S.pending=false;renderTabs();const v=$("view");
  if(S.area==="gerenciamento")v.replaceChildren(...viewGer());else v.replaceChildren(...viewSetor(S.area));
}

/* ---------- aba do gestor ---------- */
function viewSetor(s){
  const meta=SETORES.find(x=>x[0]===s);const r=resumoSetor(s);
  const head=h("div",{class:"row"},h("div",{},h("h2",{text:meta[1]}),h("div",{class:"meta",text:"Gestor: "+meta[2]+" · competência "+compTxt()})),
    r.ag?h("div",{class:"strip "+(r.noPrazo?"s-ok":"s-bad")},r.noPrazo?"Agenda enviada até 01/"+compTxt():"Agenda enviada depois do dia 01"):h("div",{class:"strip s-bad"},"Sem agenda para "+compTxt()+". Prazo: dia 01."));
  const out=[head,subnav([["treinos","Treinamentos"],["equipe","Equipe e checklist"],["blitz","Blitz"]],S.sub,k=>S.sub=k)];
  if(S.sub==="equipe")out.push(...viewEquipe(s));else if(S.sub==="blitz")out.push(...viewBlitzSetor(s));else out.push(...viewTreinos(s,r));
  return out;
}
function viewTreinos(s,r){
  const out=[h("div",{class:"kpis"},kpi(r.ag,"agendados"),kpi(r.co,"comprovados"),kpi(r.va,"validados","good"),kpi(r.at,"sem comprovação",r.at?"alert":"")),bar(r.pct,r.va+" de "+r.ag+" validados · "+r.pct+"%")];
  if(S.canWrite){
    const fid=k=>"n-"+k;
    const form=h("form",{class:"grid",onsubmit:async ev=>{ev.preventDefault();const d={setor:s,tema:$(fid("tema")).value.trim(),data:$(fid("data")).value,hora:$(fid("hora")).value||null,instrutor:$(fid("instr")).value.trim()||null,publico:$(fid("pub")).value.trim()||null,previstos:$(fid("prev")).value?Number($(fid("prev")).value):null,tipo:$(fid("tipo")).value,evidencias:{},participantes:[],criadoPor:S.uid,criadoEm:nowISO()};
      if(!d.tema||!d.data)return;try{await S.db.collection("treinamentos").add(d);toast("Treinamento agendado");if(d.data.slice(0,7)!==comp()){$("competencia").value=d.data.slice(0,7)}render()}catch(e){toast(errMsg(e,"Não foi possível agendar."))}}},
      h("label",{class:"f",for:fid("tema")},"Tema",h("input",{id:fid("tema"),required:true,maxlength:"120",list:"temas-"+s})),
      s==="governanca"?h("datalist",{id:"temas-"+s},["Manual das Camareiras","Produtos Químicos (ASGs)","Modalidades Operacionais (ASGs)"].map(x=>h("option",{value:x}))):null,
      h("label",{class:"f",for:fid("tipo")},"Tipo",h("select",{id:fid("tipo")},h("option",{},"Obrigatório do manual"),h("option",{},"Complementar"))),
      h("label",{class:"f",for:fid("data")},"Data",h("input",{type:"date",id:fid("data"),required:true,value:hoje()})),
      h("label",{class:"f",for:fid("hora")},"Horário",h("input",{type:"time",id:fid("hora")})),
      h("label",{class:"f",for:fid("instr")},"Instrutor",h("input",{id:fid("instr"),maxlength:"80"})),
      h("label",{class:"f",for:fid("pub")},"Público / função",h("input",{id:fid("pub"),maxlength:"80"})),
      h("label",{class:"f",for:fid("prev")},"Previstos",h("input",{type:"number",id:fid("prev"),min:"1",max:"300"})),
      h("button",{class:"btn",type:"submit"},"Agendar"));
    out.push(h("details",{},h("summary",{},"Agendar treinamento"),h("div",{style:"margin-top:12px"},form)));

const toSnake=k=>k.replace(/[A-Z]/g,m=>"_"+m.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const rowIn=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[toSnake(k),v===""?null:v]));
const rowOut=r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[toCamel(k),v]));
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function deepMerge(a,b){const o={...(a||{})};for(const[k,v]of Object.entries(b)){o[k]=isObj(v)&&isObj(o[k])?deepMerge(o[k],v):v}return o}
const negado=e=>({code:"invalid_argument",message:(e&&e.message)||"sem permissão"});

/* Camada que oferece ao portal a mesma interface de antes (collection/doc/onSnapshot) sobre o Supabase */
function criarDb(sb){
  const subs={};// tabela -> [fn]
  const timers={};
  async function carregar(t){
    let all=[],from=0;
    for(;;){const{data,error}=await sb.from(t).select("*").range(from,from+999);if(error)throw negado(error);all=all.concat(data);if(data.length<1000)break;from+=1000}
    return all;
  }
  async function emitir(t){
    if(!subs[t])return;
    try{const rows=await carregar(t);const docs=rows.map(r=>{const d=rowOut(r);const id=String(d.id);delete d.id;return{id,exists:true,data:()=>d}});subs[t].forEach(fn=>fn({docs,size:docs.length,empty:!docs.length}))}
    catch(e){console.error(e)}
  }
  const agendar=t=>{clearTimeout(timers[t]);timers[t]=setTimeout(()=>emitir(t),150)};
  function docRef(t,id){return{id,path:t+"/"+id,
    async get(){const{data,error}=await sb.from(t).select("*").eq("id",id).maybeSingle();if(error)throw negado(error);return{id,exists:!!data,data:()=>data?rowOut(data):undefined}},
    async set(d){const{data,error}=await sb.from(t).upsert({...rowIn(d),id}).select("id");if(error||!data||!data.length)throw negado(error);agendar(t)},
    async update(d){
      const jsonKeys=Object.keys(d).filter(k=>isObj(d[k]));let patch=rowIn(d);
      if(jsonKeys.length){const cols=jsonKeys.map(toSnake).join(",");const{data:cur,error:e1}=await sb.from(t).select(cols).eq("id",id).maybeSingle();if(e1||!cur)throw negado(e1);jsonKeys.forEach(k=>{patch[toSnake(k)]=deepMerge(cur[toSnake(k)],d[k])})}
      const{data,error}=await sb.from(t).update(patch).eq("id",id).select("id");if(error||!data||!data.length)throw negado(error);agendar(t)},
    async delete(){const{error}=await sb.from(t).delete().eq("id",id);if(error)throw negado(error);agendar(t)}}}
  return{
    doc(p){const s=p.split("/");return docRef(s[0],s[1])},
    collection(t){return{path:t,doc:id=>docRef(t,id),
      async add(d){const{data,error}=await sb.from(t).insert(rowIn(d)).select("id");if(error||!data||!data.length)throw negado(error);agendar(t);return docRef(t,data[0].id)},
      onSnapshot(fn,err){(subs[t]=subs[t]||[]).push(fn);emitir(t);
        try{sb.channel("rt-"+t).on("postgres_changes",{event:"*",schema:"public",table:t},()=>agendar(t)).subscribe()}catch(e){}
        return()=>{subs[t]=(subs[t]||[]).filter(f=>f!==fn)}}}}
  };
}
function criarArquivos(sb){
  return{
    async upload(file,o){
      const nome=(file.name||"arquivo").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").slice(-60);
      const path=(o&&o.setor||"geral")+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now())+"-"+nome;
      const{error}=await sb.storage.from("evidencias").upload(path,file,{contentType:(o&&o.type)||file.type||undefined,upsert:false});
      if(error){const m=(error.message||"").toLowerCase();throw{code:m.includes("size")||m.includes("large")?"too_large":m.includes("mime")||m.includes("type")?"unsupported_type":"upstream_error",message:error.message}}
      return{id:path};
    },
    async url(path){const{data,error}=await sb.storage.from("evidencias").createSignedUrl(path,600);if(error)throw error;return data.signedUrl}
  };
}
